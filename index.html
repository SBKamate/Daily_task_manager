<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Task Planner</title>

    <!-- Bootstrap 5 -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    

    <div class="container">

        <h1 class="text-center mt-5">Daily Task Planner</h1>

<p class="subtitle">
    Plan your day. Complete your goals. Stay productive.
</p>

<p id="currentDate" class="text-center"></p>

        <!-- Add Task -->
        <div class="input-group mb-4">

            <input 
                type="text"
                id="taskInput"
                class="form-control"
                placeholder="Enter a task..."
            >

            <button 
                id="addTaskBtn"
                class="btn btn-primary"
            >
                Add
            </button>

        </div>


        <!-- Filters -->
        <div class="text-center mb-4">

            <button class="btn btn-outline-primary filter-btn" data-filter="all">
                All
            </button>

            <button class="btn btn-outline-primary filter-btn" data-filter="pending">
                Pending
            </button>

            <button class="btn btn-outline-primary filter-btn" data-filter="completed">
                Completed
            </button>

        </div>


        <!-- Task List -->
        <div id="taskList"></div>

    </div>


    <script src="script.js"></script>


</body>

</html>
